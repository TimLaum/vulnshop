# sonar-project.properties - Configuration SonarQube pour VulnShop

sonar.projectKey=vulnshop
sonar.projectName=VulnShop - TP DevSecOps
sonar.projectVersion=1.0

# Sources
sonar.sources=app
sonar.language=py
sonar.python.version=3

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/tests/**

# Encodage
sonar.sourceEncoding=UTF-8

# Rapports de couverture (optionnel si pytest-cov configuré)
# sonar.python.coverage.reportPaths=coverage.xml

# Bandit plugin SonarQube - rapport externe
# sonar.python.bandit.reportPaths=bandit-report.json

# Qualité — gate par défaut
sonar.qualitygate.wait=false
