# .gitlab-ci.yml - Pipeline DevSecOps VulnShop
# TP Sécurité Master 1 - NE PAS UTILISER EN PRODUCTION

stages:
  - lint
  - sast
  - build
  - scan-image
  - dast
  - report

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  SONAR_HOST_URL: "http://sonarqube:9000"
  SONAR_PROJECT_KEY: "vulnshop"
  TRIVY_SEVERITY: "CRITICAL,HIGH,MEDIUM"
  TRIVY_EXIT_CODE: "1"           # TODO 6.2 résolu : bloque le pipeline sur CVE CRITICAL
  BANDIT_EXIT_ZERO: "false"      # TODO 6.1 résolu : bloque sur sévérité HIGH

# ─── ÉTAPE 1 : Lint / qualité du code ───────────────────────────────────────

flake8-lint:
  stage: lint
  image: python:3.9-slim
  before_script:
    - pip install flake8 --quiet
  script:
    - flake8 app/ --max-line-length=120 --statistics || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - flake8-report.txt
    expire_in: 1 week

# ─── ÉTAPE 2 : SAST ──────────────────────────────────────────────────────────

bandit-sast:
  stage: sast
  image: python:3.9-slim
  before_script:
    - pip install bandit --quiet
  script:
    - echo "=== Analyse Bandit SAST ==="
    - bandit -r app/ -f json -o bandit-report.json || true
    - bandit -r app/ -f txt  -o bandit-report.txt  || true
    # TODO 6.1 résolu : retire --exit-zero → pipeline échoue si vuln HIGH détectée
    - bandit -r app/ --severity-level high
    - echo "Rapport généré — voir artefacts"
  allow_failure: true
  artifacts:
    when: always
    reports:
      # Format SAST GitLab natif (nécessite conversion — voir script sonar)
      # sast: bandit-report.json
    paths:
      - bandit-report.json
      - bandit-report.txt
    expire_in: 1 week

sonarqube-sast:
  stage: sast
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
        -Dsonar.projectKey=${SONAR_PROJECT_KEY}
        -Dsonar.sources=app/
        -Dsonar.host.url=${SONAR_HOST_URL}
        -Dsonar.login=${SONAR_TOKEN}
        -Dsonar.python.version=3
        -Dsonar.qualitygate.wait=false
  allow_failure: true
  needs: []

# TODO 6.3 résolu : job pip-audit pour analyser les dépendances Python
pip-audit:
  stage: sast
  image: python:3.9-slim
  before_script:
    - pip install pip-audit --quiet
  script:
    - echo "=== Analyse pip-audit des dépendances ==="
    - pip install -r app/requirements.txt --quiet || true
    - pip-audit -r app/requirements.txt -f json -o pip-audit-report.json || true
    - pip-audit -r app/requirements.txt
  allow_failure: true
  artifacts:
    when: always
    paths:
      - pip-audit-report.json
    expire_in: 1 week

# ─── ÉTAPE 3 : Build Docker ──────────────────────────────────────────────────

build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$DOCKER_IMAGE" app/
    - docker push "$DOCKER_IMAGE"
    - docker save "$DOCKER_IMAGE" -o vulnshop-image.tar
  artifacts:
    paths:
      - vulnshop-image.tar
    expire_in: 1 day

# ─── ÉTAPE 4 : Scan d'image Trivy ────────────────────────────────────────────

trivy-image-scan:
  stage: scan-image
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "=== Scan Trivy de l'image Docker ==="
    - trivy image
        --severity ${TRIVY_SEVERITY}
        --exit-code ${TRIVY_EXIT_CODE}
        --format table
        --output trivy-image-report.txt
        "$DOCKER_IMAGE"
    - trivy image
        --severity ${TRIVY_SEVERITY}
        --format json
        --output trivy-image-report.json
        "$DOCKER_IMAGE"
    - echo "=== Scan Trivy du filesystem ==="
    - trivy fs
        --severity ${TRIVY_SEVERITY}
        --format table
        --output trivy-fs-report.txt
        app/
  allow_failure: true
  artifacts:
    when: always
    paths:
      - trivy-image-report.txt
      - trivy-image-report.json
      - trivy-fs-report.txt
    expire_in: 1 week
  needs:
    - build-image

trivy-config-scan:
  stage: scan-image
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "=== Audit de la configuration Dockerfile ==="
    - trivy config --format table app/Dockerfile
    - trivy config --format json --output trivy-config-report.json app/
  allow_failure: true
  artifacts:
    when: always
    paths:
      - trivy-config-report.json
    expire_in: 1 week

# ─── ÉTAPE 5 : DAST avec Burp CLI (Community workaround via ZAP) ─────────────

zap-dast:
  stage: dast
  image: ghcr.io/zaproxy/zaproxy:stable
  variables:
    ZAP_TARGET: "http://vulnshop-app:5000"
  script:
    - zap-baseline.py
        -t ${ZAP_TARGET}
        -r zap-report.html
        -J zap-report.json
        --auto
        || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week

# ─── ÉTAPE 6 : Rapport consolidé ─────────────────────────────────────────────

consolidate-report:
  stage: report
  image: python:3.9-slim
  before_script:
    - pip install jinja2 --quiet
  script:
    - python ci/generate_report.py
  artifacts:
    when: always
    paths:
      - security-report.html
    expire_in: 1 month
  needs:
    - bandit-sast
    - trivy-image-scan
